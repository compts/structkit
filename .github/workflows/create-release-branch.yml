name: Create Release Branchs

on:
  push:
    branches:
      - 'dev/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: get_version
        run: |
          FULL_VERSION=$(node -p "require('./package.json').version")
          # Strip any -rc.N (or other prerelease) suffix so every RC iteration
          # for a version lands on the SAME release branch instead of a new one.
          BASE_VERSION=$(echo "$FULL_VERSION" | cut -d'-' -f1)
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=$BASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set branch name
        id: branch
        run: echo "name=release/v${{ steps.get_version.outputs.base_version }}" >> "$GITHUB_OUTPUT"

      - name: Check if release branch already exists
        id: check_branch
        run: |
          if git ls-remote --exit-code --heads origin ${{ steps.branch.outputs.name }}; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push release branch
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          git checkout -b ${{ steps.branch.outputs.name }} ${{ github.ref_name }}
          git push origin ${{ steps.branch.outputs.name }}

      - name: Create Pull Request into main
        if: steps.check_branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ steps.branch.outputs.name }} \
            --title "Release v${{ steps.get_version.outputs.base_version }}" \
            --body "Automated release PR for version ${{ steps.get_version.outputs.base_version }}, cut from ${{ github.ref_name }}."
